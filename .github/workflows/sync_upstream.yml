name: Sync upstream AltTab
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.sync.outputs.branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/sync_upstream.sh
  validate:
    needs: sync
    if: needs.sync.outputs.branch != '' # only a clean merge produces a branch to check
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.sync.outputs.branch }}
